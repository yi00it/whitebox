name: Release

# Push a tag like v1.2.0 to build and publish a GitHub Release with downloadable binaries.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')

          # The installer is the only download: self-contained exe, Start menu entry, uninstaller, in-app updates.
          dotnet publish Whitebox.csproj -c Release -r win-x64 --self-contained true "-p:Version=$version" `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/app

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\out\app\Whitebox.exe" installer/Whitebox.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }

          # The app verifies downloaded updates against this file.
          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "Whitebox ${{ github.ref_name }}" --generate-notes
