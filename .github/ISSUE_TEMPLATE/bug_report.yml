name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Whitebox version
      description: Shown at the bottom of the sidebar.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which download?
      options:
        - Standalone .exe
        - requires-dotnet10 zip
        - Built from source
  - type: checkboxes
    id: admin
    attributes:
      label: Mode
      options:
        - label: I was running as administrator
